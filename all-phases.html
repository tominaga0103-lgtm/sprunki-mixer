<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprunki Mixer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    /* ヘッダー */
    header {
      background: #1a1a1a;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .reset-btn, .view-btn {
      background: #333;
      border: 1px solid #555;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .reset-btn:active, .view-btn:active { background: #444; }

    /* ===== 共通：キャラボタン ===== */
    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e1e1e;
      border: 2px solid #2a2a2a;
      border-radius: 14px;
      padding: 10px 6px 8px;
      cursor: pointer;
      position: relative;
      min-height: 92px;
      justify-content: center;
    }
    .char-btn img {
      width: 52px;
      height: 60px;
      object-fit: contain;
      filter: grayscale(100%) brightness(0.55);
      transition: filter 0.25s;
    }
    .char-btn.active img { filter: grayscale(0%) brightness(1.05); }
    .char-btn.pending img { animation: blink-img 0.4s ease-in-out infinite alternate; }
    @keyframes blink-img {
      from { filter: grayscale(100%) brightness(0.55); }
      to   { filter: grayscale(0%) brightness(0.9); }
    }
    .char-name {
      font-size: 0.6rem;
      color: #888;
      margin-top: 5px;
      text-align: center;
      line-height: 1.2;
    }
    .char-btn.active .char-name { color: #ddd; }
    .playing-dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: blink 1s ease-in-out infinite;
      display: none;
    }
    .char-btn.active .playing-dot { display: block; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* 音符エフェクト */
    .note {
      position: absolute; top: -6px;
      font-size: 0.9rem;
      animation: float-note 1.1s ease-out forwards;
      pointer-events: none; z-index: 5;
    }
    @keyframes float-note {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-32px) scale(1.3); }
    }

    /* ===== モバイル表示（タブ + グリッド）===== */
    .mobile-view { max-width: 600px; margin: 0 auto; }
    .phase-tabs {
      display: flex;
      overflow-x: auto;
      padding: 12px 16px;
      gap: 8px;
      background: #1a1a1a;
      border-bottom: 1px solid #222;
      scrollbar-width: none;
      position: sticky;
      top: 53px;
      z-index: 9;
    }
    .phase-tabs::-webkit-scrollbar { display: none; }
    .phase-tab {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      white-space: nowrap;
      background: #2a2a2a;
      color: #888;
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px;
    }

    /* ===== PC表示（テーブル）===== */
    .desktop-view { display: none; padding: 20px; overflow-x: auto; }
    table { border-collapse: collapse; min-width: 100%; }
    thead th {
      padding: 4px 2px 10px;
      text-align: center;
      font-size: 0.65rem;
      color: #666;
      font-weight: 500;
      min-width: 72px;
      vertical-align: bottom;
    }
    thead th:first-child { min-width: 80px; text-align: left; }
    tbody tr { border-top: 1px solid #222; }
    .phase-label {
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      vertical-align: middle;
    }
    .phase-label span {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
    }
    td.char-cell { padding: 4px; vertical-align: middle; }
    .char-empty {
      width: 68px; height: 74px;
      display: flex; align-items: center; justify-content: center;
      color: #333;
    }
    /* テーブル内ボタンは少し小さく */
    .desktop-view .char-btn { width: 68px; min-height: 78px; padding: 6px 4px 4px; }
    .desktop-view .char-btn img { width: 44px; height: 50px; }
    .desktop-view .char-name { display: none; }

    /* ===== 再生中バー ===== */
    .now-playing {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      margin: 0 auto;
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 50px;
    }
    .now-playing-label { font-size: 0.7rem; color: #666; flex-shrink: 0; }
    .now-playing-icons {
      display: flex; gap: 5px; flex: 1;
      overflow-x: auto; scrollbar-width: none;
    }
    .now-playing-icons::-webkit-scrollbar { display: none; }
    .mini-char {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.6rem;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ===== ローディング ===== */
    #loading {
      position: fixed; inset: 0;
      background: #0f0f0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #333;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #a855f7; margin-top: 14px; font-size: 0.95rem; }

    /* ===== レスポンシブ切替（自動）===== */
    /* PC幅では desktop-view を表示、mobile-view を隠す */
    body.auto-mode .desktop-view { display: none; }
    body.auto-mode .mobile-view  { display: block; }
    @media (min-width: 820px) {
      body.auto-mode .desktop-view { display: block; }
      body.auto-mode .mobile-view  { display: none; }
    }
    /* 手動切替 */
    body.force-desktop .desktop-view { display: block; }
    body.force-desktop .mobile-view  { display: none; }
    body.force-mobile .desktop-view  { display: none; }
    body.force-mobile .mobile-view   { display: block; }
  </style>
</head>
<body class="auto-mode">

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="load-text">サウンドを読み込み中...</div>
</div>

<header>
  <h1>🎵 Sprunki Mixer</h1>
  <div class="header-right">
    <button class="view-btn" id="view-btn" onclick="cycleView()">🖥 自動</button>
    <button class="reset-btn" onclick="resetAll()">🔄 リセット</button>
  </div>
</header>

<!-- モバイル：タブ + グリッド -->
<div class="mobile-view">
  <div class="phase-tabs" id="phase-tabs"></div>
  <div class="char-grid" id="char-grid"></div>
</div>

<!-- PC：テーブル -->
<div class="desktop-view">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="now-playing">
  <span class="now-playing-label">再生中</span>
  <div class="now-playing-icons" id="now-playing-icons"></div>
</div>

<script src="phases-aligned.js"></script>
<script>
const PHASE_CONFIG = [
  { key: 'phase2', label: 'Phase 2', color: '#3b82f6' },
  { key: 'phase3', label: 'Phase 3', color: '#a855f7' },
  { key: 'phase4', label: 'Phase 4', color: '#ef4444' },
  { key: 'phase5', label: 'Phase 5', color: '#f97316' },
  { key: 'phase7', label: 'Phase 7', color: '#10b981' },
  { key: 'phase8', label: 'Phase 8', color: '#f59e0b' },
];
const NOTES = ['♩','♪','♫','♬','🎵','🎶'];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBuffers = {};
const activeSources = {};
const activeState = {};   // stateKey -> {phaseKey, canonKey, charData}
let currentPhase = 'phase3';

// ===== クォンタイズ同期 =====
const LOOP_DURATION = 8.0;
let masterStartTime = null;
function getQuantizedStart() {
  const now = audioCtx.currentTime;
  if (masterStartTime === null) return now + 0.02;
  const elapsed = now - masterStartTime;
  const cyclesDone = Math.floor(elapsed / LOOP_DURATION);
  return masterStartTime + (cyclesDone + 1) * LOOP_DURATION;
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// ===== 表示モード切替 =====
const VIEW_MODES = ['auto', 'desktop', 'mobile'];
const VIEW_LABELS = { auto: '🖥 自動', desktop: '🖥 PC', mobile: '📱 スマホ' };
let viewModeIdx = 0;
function cycleView() {
  viewModeIdx = (viewModeIdx + 1) % 3;
  const mode = VIEW_MODES[viewModeIdx];
  document.body.className = mode === 'auto' ? 'auto-mode' :
                           (mode === 'desktop' ? 'force-desktop' : 'force-mobile');
  document.getElementById('view-btn').textContent = VIEW_LABELS[mode];
}

// ===== モバイル：タブ =====
function buildTabs() {
  const container = document.getElementById('phase-tabs');
  container.innerHTML = '';
  PHASE_CONFIG.forEach(phase => {
    const tab = document.createElement('div');
    tab.className = 'phase-tab';
    tab.textContent = phase.label;
    if (phase.key === currentPhase) {
      tab.style.background = hexToRgba(phase.color, 0.25);
      tab.style.color = phase.color;
      tab.style.borderColor = phase.color;
    }
    tab.addEventListener('click', () => { currentPhase = phase.key; buildTabs(); buildGrid(); });
    container.appendChild(tab);
  });
}

// ===== モバイル：グリッド =====
function buildGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  const phaseData = PHASES_ALIGNED[currentPhase];
  const phaseColor = PHASE_CONFIG.find(p => p.key === currentPhase).color;

  CANONICAL_CHARS.forEach(canon => {
    const c = phaseData[canon.key];
    if (!c) return;
    grid.appendChild(makeCharBtn(currentPhase, canon, c, phaseColor, false));
  });
}

// ===== PC：テーブル =====
function buildTable() {
  // ヘッダー
  const thead = document.getElementById('thead');
  const trh = document.createElement('tr');
  trh.appendChild(document.createElement('th'));
  CANONICAL_CHARS.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.display;
    trh.appendChild(th);
  });
  thead.innerHTML = '';
  thead.appendChild(trh);

  // ボディ
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  PHASE_CONFIG.forEach(phase => {
    const tr = document.createElement('tr');
    const tdLabel = document.createElement('td');
    tdLabel.className = 'phase-label';
    tdLabel.innerHTML = `<span style="background:${hexToRgba(phase.color,0.15)};color:${phase.color};border:1px solid ${hexToRgba(phase.color,0.3)};">${phase.label}</span>`;
    tr.appendChild(tdLabel);

    const phaseData = PHASES_ALIGNED[phase.key];
    CANONICAL_CHARS.forEach(canon => {
      const td = document.createElement('td');
      td.className = 'char-cell';
      const c = phaseData[canon.key];
      if (c) {
        td.appendChild(makeCharBtn(phase.key, canon, c, phase.color, true));
      } else {
        td.innerHTML = '<div class="char-empty">—</div>';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// ===== キャラボタン生成（共通）=====
function makeCharBtn(phaseKey, canon, charData, phaseColor, isDesktop) {
  const stateKey = phaseKey + '_' + canon.key;
  const btn = document.createElement('div');
  btn.className = 'char-btn';
  btn.dataset.stateKey = stateKey;
  btn.style.color = phaseColor;
  btn.title = charData.name;
  btn.innerHTML = `
    <span class="playing-dot"></span>
    <img src="${charData.image}" alt="${canon.display}">
    <div class="char-name">${canon.display}</div>
  `;
  if (activeState[stateKey]) applyActiveStyle(btn, phaseColor);
  btn.addEventListener('click', () => toggleChar(phaseKey, canon.key, charData, phaseColor));
  return btn;
}

function applyActiveStyle(btn, color) {
  btn.classList.add('active');
  btn.style.borderColor = color;
  btn.style.background = hexToRgba(color, 0.1);
  btn.style.boxShadow = `0 0 14px ${hexToRgba(color, 0.35)}`;
}
function clearActiveStyle(btn) {
  btn.classList.remove('active', 'pending');
  btn.style.borderColor = '';
  btn.style.background = '';
  btn.style.boxShadow = '';
}

// 全ビューの同じstateKeyのボタンを取得（PC・モバイル両方）
function getButtons(stateKey) {
  return document.querySelectorAll(`[data-state-key="${stateKey}"]`);
}

// ===== キャラ ON/OFF =====
function toggleChar(phaseKey, canonKey, charData, phaseColor) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const stateKey = phaseKey + '_' + canonKey;
  const btns = getButtons(stateKey);

  if (activeState[stateKey]) {
    delete activeState[stateKey];
    stopLoop(stateKey);
    btns.forEach(clearActiveStyle);
  } else {
    activeState[stateKey] = { phaseKey, canonKey, charData };
    const startAt = getQuantizedStart();
    const waitMs = Math.max(0, (startAt - audioCtx.currentTime) * 1000);
    btns.forEach(b => b.classList.add('pending'));
    playLoopAt(stateKey, charData.sound, startAt);
    setTimeout(() => {
      if (activeState[stateKey]) {
        getButtons(stateKey).forEach(b => {
          b.classList.remove('pending');
          applyActiveStyle(b, phaseColor);
          spawnNotes(b);
        });
      }
    }, waitMs);
  }
  updateNowPlaying();
}

function playLoopAt(stateKey, soundPath, startAt) {
  stopLoop(stateKey);
  const buf = audioBuffers[soundPath];
  if (!buf) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  src.loopStart = 0;
  src.loopEnd = Math.min(LOOP_DURATION, buf.duration);
  src.connect(audioCtx.destination);
  src.start(startAt);
  if (masterStartTime === null) masterStartTime = startAt;
  activeSources[stateKey] = src;
}

function stopLoop(stateKey) {
  if (activeSources[stateKey]) {
    try { activeSources[stateKey].stop(); } catch(e){}
    delete activeSources[stateKey];
  }
}

function resetAll() {
  Object.keys(activeState).forEach(k => {
    stopLoop(k);
    getButtons(k).forEach(clearActiveStyle);
    delete activeState[k];
  });
  masterStartTime = null;
  updateNowPlaying();
}

function updateNowPlaying() {
  const container = document.getElementById('now-playing-icons');
  const keys = Object.keys(activeState);
  if (keys.length === 0) {
    container.innerHTML = '<span style="color:#444;font-size:0.7rem;">キャラをタップして音を重ねよう</span>';
    return;
  }
  container.innerHTML = keys.map(k => {
    const { phaseKey, canonKey } = activeState[k];
    const phase = PHASE_CONFIG.find(p => p.key === phaseKey);
    const canon = CANONICAL_CHARS.find(c => c.key === canonKey);
    return `<span class="mini-char" style="background:${hexToRgba(phase.color,0.2)};color:${phase.color};border:1px solid ${phase.color};">${phase.label.replace('Phase ','P')} ${canon.display}</span>`;
  }).join('');
}

function spawnNotes(btn) {
  for (let i = 0; i < 2; i++) {
    setTimeout(() => {
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = NOTES[Math.floor(Math.random() * NOTES.length)];
      note.style.left = (12 + Math.random() * 28) + 'px';
      btn.appendChild(note);
      note.addEventListener('animationend', () => note.remove());
    }, i * 120);
  }
}

// ===== サウンドプリロード =====
async function loadSounds() {
  const soundSet = new Set();
  PHASE_CONFIG.forEach(phase => {
    const phaseData = PHASES_ALIGNED[phase.key];
    CANONICAL_CHARS.forEach(canon => {
      const c = phaseData[canon.key];
      if (c) soundSet.add(c.sound);
    });
  });
  const sounds = [...soundSet];
  let done = 0;
  const loadText = document.getElementById('load-text');
  for (const sound of sounds) {
    try {
      const res = await fetch(sound);
      const buf = await res.arrayBuffer();
      audioBuffers[sound] = await audioCtx.decodeAudioData(buf);
    } catch(e) { console.warn('Failed:', sound); }
    done++;
    loadText.textContent = `サウンドを読み込み中... (${done}/${sounds.length})`;
  }
  document.getElementById('loading').style.display = 'none';
}

buildTabs();
buildGrid();
buildTable();
updateNowPlaying();
loadSounds();
</script>
</body>
</html>
